name: kufar
services:
  bot:
    build:
      context: ../
      dockerfile: ./Docker/bot/Dockerfile
      network: host
    image: bot
    container_name: kufar-bot
    restart: always
    network_mode: host
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGODB_URL=${MONGODB_URL}
      - API_BASE_URL=http://127.0.0.1:3000/api
    depends_on:
      mongodb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  parser:
    build:
      context: ../
      dockerfile: ./Docker/parser/Dockerfile
      network: host
    image: parser
    container_name: kufar-parser
    restart: always
    network_mode: host
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MONGODB_URL=${MONGODB_URL}
      - API_BASE_URL=http://127.0.0.1:3000/api
      - KUFAR_MIN_INTERVAL_MS=${KUFAR_MIN_INTERVAL_MS}
      - NOTIFY_MIN_PRICE_BYN=${NOTIFY_MIN_PRICE_BYN}
      - NOTIFY_MAX_PRICE_BYN=${NOTIFY_MAX_PRICE_BYN}
      - NOTIFY_SOURCE_MAX_PRICE_BYN=${NOTIFY_SOURCE_MAX_PRICE_BYN}
      - NOTIFY_DEDUPE_WINDOW_MINUTES=${NOTIFY_DEDUPE_WINDOW_MINUTES}
      - NOTIFY_PRINTER_MAX_PRICE_BYN=${NOTIFY_PRINTER_MAX_PRICE_BYN}
    depends_on:
      api:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  api:
    build:
      context: ../
      dockerfile: ./Docker/api/Dockerfile
      network: host
    image: api
    container_name: kufar-api
    restart: always
    network_mode: host
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGODB_URL=${MONGODB_URL}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  mongodb:
    image: mongo:latest
    container_name: kufar-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    command:
      - mongod
      - --auth
      - --bind_ip_all
    volumes:
      - kufar-mongodb-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.runCommand('ping').ok\" | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - kufar-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
networks:
  kufar-network:
    driver: bridge
volumes:
  kufar-mongodb-data:
    name: docker_patrebna-mongodb-data
