services:
  bot:
    build:
      context: ../
      dockerfile: ./Docker/bot/Dockerfile
    image: bot
    container_name: patrebna-bot
    restart: always
    ports:
      - "8443:8443"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - WEBHOOK_PORT=${WEBHOOK_PORT:-8443}
      - HOST=${HOST}
      - USE_TUNNEL=${USE_TUNNEL:-false}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CRON_SCHEDULE_FREE=${CRON_SCHEDULE_FREE:-*/30 * * * * *}
      - CRON_SCHEDULE_PREMIUM=${CRON_SCHEDULE_PREMIUM:-*/5 * * * *}
    depends_on:
      - mongodb
      - redis
    networks:
      - patrebna-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  parser:
    build:
      context: ../
      dockerfile: ./Docker/parser/Dockerfile
    image: parser
    container_name: patrebna-parser
    restart: always
    ports:
      - "3001:3001"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - mongodb
      - redis
    networks:
      - patrebna-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  api:
    build:
      context: ../
      dockerfile: ./Docker/api/Dockerfile
    image: api
    container_name: patrebna-api
    restart: always
    ports:
      - "443:3000"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - HOST=${HOST}
      - STORE_ID=${STORE_ID}
      - BEPAID_API_KEY=${BEPAID_API_KEY}
    volumes:
      - ../certs/ca.pem:/usr/src/app/certs/ca.pem:ro
      - ../certs/server.pem:/usr/src/app/certs/server.pem:ro
      - ../certs/server-key.pem:/usr/src/app/certs/server-key.pem:ro
      - ../certs/client.pem:/usr/src/app/certs/client.pem:ro
    depends_on:
      - mongodb
    networks:
      - patrebna-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
  mongodb:
    image: mongo:latest
    container_name: patrebna-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    command:
      - mongod
      - --replSet
      - rs0
      - --tlsMode
      - requireTLS
      - --tlsCertificateKeyFile
      - /etc/ssl/mongodb.pem
      - --tlsCAFile
      - /etc/ssl/ca.pem
      - --auth
      - --keyFile
      - /etc/ssl/mongo-keyfile
      - --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db
      - ../certs/mongodb/mongodb.pem:/etc/ssl/mongodb.pem
      - ../certs/ca.pem:/etc/ssl/ca.pem
      - ../certs/mongo-keyfile:/etc/ssl/mongo-keyfile
    networks:
      - patrebna-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: redis:latest
    container_name: patrebna-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ../certs/ca.pem:/etc/ssl/ca.pem
      - ../certs/redis:/etc/ssl/redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --tls-port
      - "6379"
      - --port
      - "0"
      - --tls-cert-file
      - /etc/ssl/redis/redis-cert.pem
      - --tls-key-file
      - /etc/ssl/redis/redis-key.pem
      - --tls-ca-cert-file
      - /etc/ssl/ca.pem
      - --tls-auth-clients
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    networks:
      - patrebna-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  cloudflared:
    build:
      context: ./cloudflared
      dockerfile: Dockerfile
    image: cloudflared-tunnel
    container_name: patrebna-cloudflared
    restart: unless-stopped
    command: ["/scripts/start-tunnel.sh"]
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TUNNEL_TARGET_URL=http://bot:8443
    volumes:
      - ../scripts:/scripts:ro
    depends_on:
      - bot
    networks:
      - patrebna-network
    profiles:
      - tunnel
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  patrebna-network:
    driver: bridge
